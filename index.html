<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刻度大偵探：排水法數學挑戰 🧪</title>
  <style>
    :root {
      --primary: #3B82F6;
      --primary-dark: #1D4ED8;
      --accent: #F59E0B;
      --bg-gradient: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-card {
      background: white;
      width: 95%;
      max-width: 900px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 20px 0;
      position: relative;
    }

    header {
      background: #1E293B;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .stats {
      display: flex;
      gap: 15px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 8px;
    }

    /* Mode Selection Screen */
    #mode-select-screen {
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .mode-title {
      font-size: 2rem;
      font-weight: 800;
      color: #1E293B;
      margin-bottom: 10px;
    }

    .mode-subtitle {
      color: #64748B;
      font-size: 1.1rem;
      margin-bottom: 35px;
    }

    .mode-btn-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 650px;
    }

    .mode-card {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mode-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2);
    }

    .mode-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .mode-card h3 {
      margin: 0 0 8px 0;
      font-size: 1.4rem;
      color: #0F172A;
    }

    .mode-card p {
      margin: 0;
      color: #64748B;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* Experiment Area */
    #experiment-area {
      position: relative;
      width: 100%;
      background: #F1F5F9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    canvas {
      background: #F8FAFC;
      border-radius: 12px;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
      max-width: 100%;
      height: auto;
    }

    /* Question & Controls Area */
    #question-area {
      padding: 20px 24px;
      border-top: 1px solid #E2E8F0;
      background: #FFFFFF;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .btn-opt {
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1E293B;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-opt:hover {
      background: #EFF6FF;
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .btn-opt:active {
      transform: scale(0.98);
    }

    /* Feedback Overlay */
    #feedback-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85); /* 移除了 iPad 容易造成卡頓的 backdrop-filter */
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      border-radius: 20px;
    }

    .feedback-box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .feedback-msg {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .feedback-detail {
      font-size: 1.05rem;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Result Screen */
    #result-screen {
      padding: 30px;
      display: none;
      text-align: center;
    }

    .result-score {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .pass-tag {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .pass-tag { background: #D1FAE5; color: #065F46; }
    .fail-tag { background: #FEE2E2; color: #991B1B; }

    .review-list {
      text-align: left;
      background: #F8FAFC;
      border-radius: 12px;
      padding: 16px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .review-item {
      padding: 10px 0;
      border-bottom: 1px solid #E2E8F0;
      font-size: 0.95rem;
    }

    .review-item:last-child {
      border-bottom: none;
    }

    .btn-action {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>

<div id="game-card">
  <!-- 頁頂資訊欄 -->
  <header>
    <div class="title-group">
      <h1 id="mode-display">🧪 刻度大偵探：排水法挑戰</h1>
    </div>
    <div class="stats">
      <div class="stat-item" id="question-progress" style="display:none;">進度：1 / 5</div>
      <div class="stat-item" id="timer-display" style="display:none;">⏳ 時間：25s</div>
      <div class="stat-item" id="score-display" style="display:none;">得分：0</div>
    </div>
  </header>

  <!-- 難度選擇畫面 -->
  <div id="mode-select-screen">
    <div class="mode-title">🧪 刻度大偵探：排水法挑戰</div>
    <div class="mode-subtitle">請選擇難度級別開始挑戰：</div>
    
    <div class="mode-btn-container">
      <div class="mode-card" onclick="startGame('easy')">
        <div class="mode-icon">🟢</div>
        <h3>初級模式</h3>
        <p>• 固定容量量杯 (50 cm³)<br/>• 顯示所有主要刻度數字<br/>• 時間充裕 (25 秒/題)</p>
      </div>

      <div class="mode-card" onclick="startGame('hard')">
        <div class="mode-icon">🔥</div>
        <h3>高級模式</h3>
        <p>• 變幻容量量杯 (100-200 cm³)<br/>• 僅顯示最高容量數字，考驗逆推能力<br/>• 限時挑戰 (15 秒/題)</p>
      </div>
    </div>
  </div>

  <!-- 實驗動畫繪製區域 -->
  <div id="experiment-area" style="display:none;">
    <canvas id="simCanvas" width="800" height="320"></canvas>
  </div>

  <!-- 題目與選項區域 -->
  <div id="question-area" style="display:none;">
    <div class="question-text" id="question-text">載入題目中...</div>
    <div class="options-grid" id="options-grid"></div>
  </div>

  <!-- 結算畫面 -->
  <div id="result-screen">
    <h2>🎉 挑戰完成！</h2>
    <div class="result-score" id="final-score">得分：0 / 5</div>
    <div id="pass-status" class="pass-tag">合格！</div>

    <div class="review-list" id="review-list"></div>

    <button class="btn-action" onclick="showModeSelect()">回主選單再試一次</button>
  </div>

  <!-- 反饋彈窗 -->
  <div id="feedback-overlay">
    <div class="feedback-box">
      <div class="feedback-msg" id="feedback-msg">答對了！</div>
      <div class="feedback-detail" id="feedback-detail"></div>
    </div>
  </div>
</div>

<script>
  // --- 狀態控制變數 ---
  let currentMode = 'easy';
  let currentQuestion = 0;
  const totalQuestions = 5;
  let score = 0;
  let timerInterval = null;
  let feedbackTimeout = null;
  let timeLeft = 0;
  let canAnswer = false;
  let wrongRecords = [];

  // Canvas 動畫控制
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  let animationId = null;
  let animStartTime = null;

  // 當前題目數據
  let currentData = null;

  function clearAllTimers() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    if (feedbackTimeout) {
      clearTimeout(feedbackTimeout);
      feedbackTimeout = null;
    }
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  function showModeSelect() {
    clearAllTimers();

    document.getElementById('mode-select-screen').style.display = 'flex';
    document.getElementById('experiment-area').style.display = 'none';
    document.getElementById('question-area').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('feedback-overlay').style.display = 'none';
    
    document.getElementById('question-progress').style.display = 'none';
    document.getElementById('timer-display').style.display = 'none';
    document.getElementById('score-display').style.display = 'none';
    document.getElementById('mode-display').innerText = '🧪 刻度大偵探：排水法挑戰';
  }

  function startGame(mode) {
    clearAllTimers();
    currentMode = mode;
    currentQuestion = 0;
    score = 0;
    wrongRecords = [];

    document.getElementById('mode-select-screen').style.display = 'none';
    document.getElementById('experiment-area').style.display = 'flex';
    document.getElementById('question-area').style.display = 'block';
    document.getElementById('options-grid').style.display = 'grid';

    document.getElementById('question-progress').style.display = 'block';
    document.getElementById('timer-display').style.display = 'block';
    document.getElementById('score-display').style.display = 'block';

    const modeText = (mode === 'easy') ? '【初級模式】' : '【高級模式】';
    document.getElementById('mode-display').innerText = `🧪 刻度大偵探 ${modeText}`;
    document.getElementById('score-display').innerText = `得分：0`;

    nextQuestion();
  }

  function nextQuestion() {
    clearAllTimers();

    if (currentQuestion >= totalQuestions) {
      showResult();
      return;
    }

    currentQuestion++;
    document.getElementById('question-progress').innerText = `進度：${currentQuestion} / ${totalQuestions}`;

    generateQuestionData();
    renderQuestionUI();
    startTimer();
    triggerAnimation();
  }

  function generateQuestionData() {
    let maxVol, majorStep, step;
    
    if (currentMode === 'easy') {
      maxVol = 50;
      majorStep = 10;
      step = 2; // 每刻度 2 cm³
    } else {
      const hardConfigs = [
        { maxVol: 100, majorStep: 20, step: 5 },
        { maxVol: 150, majorStep: 25, step: 5 },
        { maxVol: 200, majorStep: 50, step: 10 }
      ];
      const selected = hardConfigs[Math.floor(Math.random() * hardConfigs.length)];
      maxVol = selected.maxVol;
      majorStep = selected.majorStep;
      step = selected.step;
    }

    const totalTicks = maxVol / step;
    const count = Math.floor(Math.random() * 3) + 2; // 2 ~ 4 個物件

    const unitVolTicks = Math.floor(Math.random() * 3) + 1; // 1 ~ 3 個小格
    const unitVol = unitVolTicks * step;
    const totalVol = unitVol * count;

    const maxStartTicks = totalTicks - (unitVolTicks * count) - 1;
    const startVolTicks = Math.floor(Math.random() * (maxStartTicks - 2 + 1)) + 2;
    const startVol = startVolTicks * step;
    const endVol = startVol + totalVol;

    const type = (Math.random() > 0.5) ? 'A' : 'B';
    const correctAnswer = (type === 'A') ? totalVol : unitVol;

    currentData = {
      type: type,
      cylinderConfig: { maxVol, majorStep, step },
      startVol: startVol,
      endVol: endVol,
      totalVol: totalVol,
      unitVol: unitVol,
      count: count,
      correctAnswer: correctAnswer
    };
  }

  function renderQuestionUI() {
    const qText = document.getElementById('question-text');
    if (currentData.type === 'A') {
      qText.innerText = `請觀察量杯，計算放入的 ${currentData.count} 個【立體】總體積是多少 cm³？`;
    } else {
      qText.innerText = `請觀察量杯，計算【每個】立體的體積是多少 cm³？`;
    }

    const options = new Set();
    options.add(currentData.correctAnswer);

    const step = currentData.cylinderConfig.step;
    while (options.size < 4) {
      let offset = (Math.floor(Math.random() * 5) - 2) * step;
      let wrongAns = currentData.correctAnswer + offset;
      if (wrongAns > 0 && wrongAns !== currentData.correctAnswer) {
        options.add(wrongAns);
      }
    }

    const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
    const grid = document.getElementById('options-grid');
    grid.innerHTML = '';
    shuffled.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt';
      btn.innerText = `${opt} cm³`;
      btn.onclick = () => checkAnswer(opt);
      grid.appendChild(btn);
    });

    canAnswer = true;
  }

  function startTimer() {
    timeLeft = (currentMode === 'easy') ? 25 : 15;
    document.getElementById('timer-display').innerText = `⏳ 時間：${timeLeft}s`;

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer-display').innerText = `⏳ 時間：${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        handleTimeout();
      }
    }, 1000);
  }

  // --- 穩定畫圖與動畫引擎 ---
  function triggerAnimation() {
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    animStartTime = null;
    const duration = 600; // 縮短動畫時間至 0.6 秒，極速流暢

    function renderLoop(timestamp) {
      if (!animStartTime) animStartTime = timestamp;
      let elapsed = timestamp - animStartTime;
      let progress = Math.min(elapsed / duration, 1);

      // Ease out cubic
      let easeProgress = 1 - Math.pow(1 - progress, 3);
      drawScene(easeProgress);

      if (progress < 1) {
        animationId = requestAnimationFrame(renderLoop);
      } else {
        animationId = null;
        drawScene(1); // 強制最後畫一次 100% 畫面
      }
    }

    // iPad 雙保險機制：萬一 iOS 節能模式凍結 requestAnimationFrame，強行於 650ms 後補畫終點畫面
    animationId = requestAnimationFrame(renderLoop);
    setTimeout(() => {
      drawScene(1);
    }, 650);
  }

  function volToY(vol, maxVol, cylY, cylH) {
    const margin = 20;
    const usableH = cylH - margin * 2;
    return Math.round(cylY + cylH - margin - (vol / maxVol) * usableH);
  }

  function drawSingleCylinder(x, y, w, h, waterVol, config, title, isRightCylinder, animProgress) {
    const baseMargin = 20;
    const bottomY = y + h - baseMargin;
    const waterTopY = volToY(waterVol, config.maxVol, y, h);

    // 1. 水體
    ctx.fillStyle = "rgba(56, 189, 248, 0.55)";
    ctx.fillRect(x + 5, waterTopY, w - 10, bottomY - waterTopY);

    // 2. 水面頂邊線
    ctx.strokeStyle = "#0284C7";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x + 5, waterTopY);
    ctx.lineTo(x + w - 5, waterTopY);
    ctx.stroke();

    // 3. 物件掉落動畫
    if (isRightCylinder && animProgress > 0) {
      const dropDistance = 80;
      const initialY = y - dropDistance;
      const targetY = bottomY - 25;
      const currentObjectY = initialY + (targetY - initialY) * animProgress;

      ctx.fillStyle = "#F59E0B";
      ctx.strokeStyle = "#B45309";
      ctx.lineWidth = 2;

      for (let i = 0; i < currentData.count; i++) {
        const objX = x + (w / (currentData.count + 1)) * (i + 1);
        ctx.beginPath();
        ctx.arc(objX, currentObjectY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    // 4. 量杯外框 (封閉底部)
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, bottomY);
    ctx.lineTo(x + w, bottomY);
    ctx.lineTo(x + w, y);
    ctx.stroke();

    // 5. 刻度線
    const totalTicks = config.maxVol / config.step;
    for (let i = 0; i <= totalTicks; i++) {
      const val = i * config.step;
      const markY = volToY(val, config.maxVol, y, h);

      const isMajor = (val % config.majorStep === 0);
      const lineLen = isMajor ? 18 : 10;

      ctx.strokeStyle = isMajor ? "#0F172A" : "#64748B";
      ctx.lineWidth = isMajor ? 1.8 : 1.0;

      ctx.beginPath();
      ctx.moveTo(x + 5, markY);
      ctx.lineTo(x + 5 + lineLen, markY);
      ctx.stroke();

      let showText = false;
      if (currentMode === 'easy') {
        showText = isMajor;
      } else {
        showText = (val === config.maxVol);
      }

      if (showText) {
        ctx.fillStyle = "#0F172A";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`${val}`, x + 5 + lineLen + 4, markY + 4);
      }
    }

    // 6. 標題
    ctx.fillStyle = "#1E293B";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(title, x + w / 2, y + h + 22);
  }

  function drawScene(progress) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cfg = currentData.cylinderConfig;
    const cylW = 140, cylH = 240, cylY = 45;

    // 左邊量杯（未放入）
    drawSingleCylinder(160, cylY, cylW, cylH, currentData.startVol, cfg, "【實驗前】未放入物件", false, 0);

    // 中間箭頭
    ctx.fillStyle = "#3B82F6";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("➔", 400, cylY + cylH / 2);

    // 右邊量杯（放入後）
    const currentRightWater = currentData.startVol + (currentData.totalVol * progress);
    drawSingleCylinder(500, cylY, cylW, cylH, currentRightWater, cfg, `【實驗後】放入 ${currentData.count} 個 立體`, true, progress);
  }

  function checkAnswer(selectedVal) {
    if (!canAnswer) return;
    canAnswer = false;
    clearAllTimers();

    const isCorrect = (selectedVal === currentData.correctAnswer);
    if (isCorrect) {
      score++;
      document.getElementById('score-display').innerText = `得分：${score}`;
      showFeedback(true, "🎉 答對了！太棒了！");
    } else {
      recordWrong(selectedVal);
      showFeedback(false, `❌ 答錯了！正確答案是 ${currentData.correctAnswer} cm³`);
    }
  }

  function handleTimeout() {
    canAnswer = false;
    clearAllTimers();
    recordWrong("超時未答");
    showFeedback(false, `⏰ 時間到！正確答案是 ${currentData.correctAnswer} cm³`);
  }

  function recordWrong(userAns) {
    let detail = "";
    if (currentData.type === 'A') {
      detail = `水位由 ${currentData.startVol} cm³ 上升至 ${currentData.endVol} cm³。${currentData.count} 個物件總體積 = ${currentData.endVol} - ${currentData.startVol} = ${currentData.totalVol} cm³。`;
    } else {
      detail = `總排水量 = ${currentData.endVol} - ${currentData.startVol} = ${currentData.totalVol} cm³。每個體積 = ${currentData.totalVol} ÷ ${currentData.count} = ${currentData.unitVol} cm³。`;
    }

    wrongRecords.push({
      qNum: currentQuestion,
      qText: document.getElementById('question-text').innerText,
      userAns: userAns,
      correctAns: currentData.correctAnswer,
      detail: detail
    });
  }

  function showFeedback(isCorrect, msg) {
    const overlay = document.getElementById('feedback-overlay');
    const msgBox = document.getElementById('feedback-msg');
    const detailBox = document.getElementById('feedback-detail');

    msgBox.innerText = msg;
    msgBox.style.color = isCorrect ? "#10B981" : "#EF4444";
    
    if(!isCorrect) {
      detailBox.innerText = wrongRecords[wrongRecords.length - 1].detail;
    } else {
      detailBox.innerText = "";
    }

    overlay.style.display = 'flex';

    feedbackTimeout = setTimeout(() => {
      overlay.style.display = 'none';
      nextQuestion();
    }, 2000);
  }

  function showResult() {
    clearAllTimers();

    document.getElementById('question-area').style.display = 'none';
    document.getElementById('options-grid').style.display = 'none';
    document.getElementById('experiment-area').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    document.getElementById('final-score').innerText = `你一共答對了 ${score} / ${totalQuestions} 題！`;

    const passStatus = document.getElementById('pass-status');
    if (score >= 3) {
      passStatus.className = 'pass-tag';
      passStatus.innerHTML = '🌟 合格！請向老師出示，並獲取貼紙一個 🎁';
    } else {
      passStatus.className = 'fail-tag';
      passStatus.innerHTML = '💪 再接再厲！請重新挑戰！';
    }

    const reviewList = document.getElementById('review-list');
    if (wrongRecords.length === 0) {
      reviewList.innerHTML = '<p style="color:#10B981; font-weight:bold;">太厲害了！全部題目答對！🎉</p>';
    } else {
      reviewList.innerHTML = wrongRecords.map(item => `
        <div class="review-item">
          <strong>第 ${item.qNum} 題：</strong>${item.qText}<br/>
          <span style="color:#EF4444;">你的答案：${item.userAns}</span> | 
          <span style="color:#10B981;">正確答案：${item.correctAns} cm³</span><br/>
          <small style="color:#475569;">💡 解析：${item.detail}</small>
        </div>
      `).join('');
    }
  }

  window.onload = showModeSelect;
</script>
</body>
</html>
